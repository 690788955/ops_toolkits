# 全局环境配置示例
# 此文件用于存储可被所有工具插件调用的全局参数
# 格式：KEY=value（支持 # 注释）

# 数据库配置
DB_HOST=localhost
DB_PORT=15432
DB_NAME=mydb
DB_USER=admin
# DB_PASSWORD=your-password-here

# API 配置
API_BASE_URL=https://api.example.com
API_TIMEOUT=30s
# API_KEY=your-api-key-here

# 环境标识
ENVIRONMENT=dev
LOG_LEVEL=info

# 插件脚本可以通过以下方式使用：
# Shell: source "$OPS_GLOBAL_ENV_FILE"
# Python: from dotenv import load_dotenv; load_dotenv(os.getenv('OPS_GLOBAL_ENV_FILE'))
# Go: godotenv.Load(os.Getenv("OPS_GLOBAL_ENV_FILE"))
# Node.js: require('dotenv').config({ path: process.env.OPS_GLOBAL_ENV_FILE })
