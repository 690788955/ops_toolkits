name: Build and Package

on:
  push:
    branches: [master]
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web UI
        run: |
          npm install --prefix web
          npm run build --prefix web

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -o "dist/opsctl${ext}" ./cmd/opsctl

      - name: Package
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          pkg="opsctl-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p opsctl/bin
          cp "dist/opsctl${ext}" opsctl/bin/
          cp -r configs opsctl/
          cp -r plugins opsctl/
          tar -czf "${pkg}.tar.gz" opsctl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: opsctl-*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: opsctl-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/opsctl-*.tar.gz
          generate_release_notes: true
