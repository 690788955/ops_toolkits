name: Build and Package

on:
  push:
    branches: [master]
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web UI
        run: |
          npm install --prefix web
          npm run build --prefix web

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build all Go binaries
        env:
          CGO_ENABLED: 0
          GOTOOLCHAIN: local
        run: |
          mkdir -p opsctl/bin
          targets="linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64"
          for target in $targets; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" go build -o "opsctl/bin/opsctl_${goos}_${goarch}${ext}" ./cmd/opsctl
          done

      - name: Package all platforms
        run: |
          cp -r configs opsctl/
          cp -r plugins opsctl/
          chmod -R 755 opsctl/plugins
          tar -czf opsctl-all-platforms.tar.gz opsctl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsctl-all-platforms
          path: opsctl-all-platforms.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opsctl-all-platforms
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/opsctl-all-platforms.tar.gz
          generate_release_notes: true
