id: docker.exec
name: Docker 容器执行
version: 1.0.0
description: 在 Docker 容器中执行命令，支持指定容器名称和待执行命令
author: ops-team

contributes:
  categories:
    - id: docker
      name: Docker
      description: Docker 容器管理工具

  tools:
    - id: docker.exec.run
      name: 容器内执行命令
      category: docker
      description: 在指定的 Docker 容器中执行命令（非交互式）
      tags: [docker, exec, container]
      command: scripts/docker-exec.sh
      args:
        - "{{ .container }}"
        - "{{ .command }}"
      workdir: .
      timeout: 30m
      parameters:
        - name: container
          type: string
          description: Docker 容器名称或 ID
          required: true
        - name: command
          type: string
          description: 在容器内执行的命令（如 ./ops/everisk/install_all.sh）
          required: true
      confirm:
        required: true
        message: 确认在容器中执行命令？请确认容器名称、命令内容及影响范围已核对。

    - id: docker.exec.bash
      name: 容器内执行 Bash 脚本
      category: docker
      description: 在指定的 Docker 容器中通过 bash -c 执行脚本命令
      tags: [docker, exec, bash]
      command: scripts/docker-exec-bash.sh
      args:
        - "{{ .container }}"
        - "{{ .script }}"
      workdir: .
      timeout: 30m
      parameters:
        - name: container
          type: string
          description: Docker 容器名称或 ID
          required: true
        - name: script
          type: string
          description: 通过 bash -c 执行的脚本内容（如 "cd /app && ./deploy.sh"）
          required: true
      confirm:
        required: true
        message: 确认在容器中执行 Bash 脚本？请确认容器名称、脚本内容及影响范围已核对。

    - id: docker.exec.shell
      name: 执行宿主机 Shell 脚本
      category: docker
      description: 在宿主机上执行指定的 Shell 脚本，支持传入自定义参数
      tags: [shell, script, host]
      command: scripts/host-shell.sh
      args:
        - "{{ .script }}"
        - "{{ .args }}"
      workdir: .
      timeout: 30m
      parameters:
        - name: script
          type: string
          description: 要执行的 Shell 脚本绝对路径（如 /opt/scripts/deploy.sh）
          required: true
        - name: args
          type: string
          description: 传递给脚本的参数（空格分隔，可选）
          required: false
          default: ""
      confirm:
        required: true
        message: 确认在宿主机执行 Shell 脚本？请确认脚本路径、参数及影响范围已核对。

    - id: docker.exec.host_command
      name: 宿主机执行命令
      category: docker
      description: 在宿主机上通过 bash -lc 执行一条命令，支持管道、重定向和 cd 等复合命令
      tags: [host, shell, command]
      command: scripts/host-command.sh
      args:
        - "{{ .command }}"
      workdir: .
      timeout: 30m
      parameters:
        - name: command
          type: string
          description: 在宿主机执行的命令（如 "docker ps" 或 "cd /opt/app && ./deploy.sh"）
          required: true
      confirm:
        required: true
        message: 确认在宿主机执行命令？请确认命令内容、工作目录和影响范围已核对。

    - id: docker.exec.verify_md5_merge
      name: 分片包 MD5 校验并合并
      category: docker
      description: 使用上传目录中的 md5.txt 校验分片包，并按清单顺序合并为完整 tar.gz 包，可选自动解压
      tags: [host, file, md5, merge]
      command: scripts/verify-md5-and-merge.sh
      args:
        - "{{ .path }}"
        - "{{ .output }}"
        - "{{ .extract }}"
      workdir: .
      timeout: 2h
      parameters:
        - name: path
          type: string
          description: 上传文件节点传入的文件路径或目录路径；传入文件时会自动使用其所在目录
          required: true
        - name: output
          type: string
          description: 合并后的输出文件名；留空时自动去掉首个分片名末尾的 .00/.01 等数字后缀
          required: false
          default: ""
        - name: extract
          type: string
          description: 是否解压合并后的 tar.gz 包；yes 解压到同目录，no 不解压
          required: false
          default: "yes"
          options:
            - "yes"
            - "no"
      outputs:
        - name: output_file
          description: 合并后的输出文件名
          type: string
          required: true
          json_path: output_file
        - name: output_path
          description: 合并后的输出文件路径
          type: string
          required: true
          json_path: output_path
        - name: extract_dir
          description: 解压目录
          type: string
          required: false
          json_path: extract_dir
      confirm:
        required: true
        message: 确认校验并合并上传目录中的分片包？请确认 md5.txt 和分片文件来自可信来源。
