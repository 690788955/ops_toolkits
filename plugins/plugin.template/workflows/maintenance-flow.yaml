id: plugin.template.maintenance-flow
name: 插件模板维护流程
description: 演示插件内 workflow 如何引用本插件工具，并用 depends_on 描述 DAG 依赖
version: 1.0.0
category: plugin-template
tags: [plugin, template, workflow]
parameters:
  - name: target
    type: string
    description: 目标标识，例如主机组、实例名或环境名
    required: true
    default: demo
  - name: action
    type: string
    description: 变更动作，示例默认 apply
    required: true
    default: apply
  - name: dry_run
    type: bool
    description: 是否仅预览动作，不修改外部系统
    required: false
    default: true
nodes:
  - id: inspect
    name: 变更前检查
    tool: plugin.template.inspect
    params:
      target: "{{ .target }}"
      action: inspect
      dry_run: true
  - id: apply
    name: 执行变更示例
    tool: plugin.template.apply
    depends_on: [inspect]
    params:
      target: "{{ .target }}"
      action: "{{ .action }}"
      dry_run: "{{ .dry_run }}"
edges:
  - from: inspect
    to: apply
confirm:
  required: true
  message: 确认执行插件模板维护流程？请确认目标、动作和回滚方案已核对。
