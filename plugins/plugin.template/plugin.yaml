id: plugin.template
name: 规范插件模板
version: 1.0.0
description: 可复制的规范插件模板，展示清单、脚本、参数、确认和工作流写法
author: your-team
compatibility:
  opsctl: ">=0.1.0"
contributes:
  categories:
    - id: plugin-template
      name: 插件模板
      description: 插件模板示例分类
  tools:
    - id: plugin.template.inspect
      name: 目标检查
      description: 普通只读工具示例，检查目标状态并输出摘要
      category: plugin-template
      tags: [plugin, template, readonly]
      command: scripts/run.sh
      args:
        - --target
        - '{{ .target }}'
        - --action
        - inspect
        - --dry-run
        - '{{ .dry_run }}'
      workdir: .
      timeout: 1m
      parameters:
        - name: target
          type: string
          description: 目标标识，例如主机组、实例名或环境名
          required: true
          default: demo
        - name: action
          type: string
          description: 执行动作，普通工具固定为 inspect
          required: false
          default: inspect
        - name: dry_run
          type: bool
          description: 是否仅预览动作，不修改外部系统
          required: false
          default: true
      confirm:
        required: false
        message: ""
    - id: plugin.template.apply
      name: 变更执行
      description: 高风险工具示例，展示 confirm.required 和 dry-run 保护
      category: plugin-template
      tags: [plugin, template, change, high-risk]
      command: scripts/run.sh
      args:
        - --target
        - '{{ .target }}'
        - --action
        - '{{ .action }}'
        - --dry-run
        - '{{ .dry_run }}'
      workdir: .
      timeout: 5m
      parameters:
        - name: target
          type: string
          description: 目标标识，例如主机组、实例名或环境名
          required: true
          default: demo
        - name: action
          type: string
          description: 执行动作，示例支持 apply 或 inspect
          required: true
          default: apply
        - name: dry_run
          type: bool
          description: 是否仅预览动作；生产变更建议先保持 true
          required: false
          default: true
      confirm:
        required: true
        message: 确认对目标执行变更示例？请确认目标、动作和回滚方案已核对。
  workflows:
    - path: workflows/maintenance-flow.yaml
