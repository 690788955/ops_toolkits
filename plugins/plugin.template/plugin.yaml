id: plugin.template
name: 插件开发模板
version: 1.0.0
description: 插件开发模板，包含配置文件使用示例和最佳实践
author: ops-team

contributes:
  categories:
    - id: example
      name: 示例分类
      description: 插件开发示例和模板

  tools:
    - id: plugin.template.simple
      name: 简单工具示例
      category: example
      description: 不使用配置文件的简单工具示例
      tags: [example, template]
      command: scripts/simple.sh
      args:
        - --message
        - "{{ .message }}"
      workdir: .
      timeout: 30s
      parameters:
        - name: message
          type: string
          description: 要显示的消息
          required: true
          default: Hello World
      confirm:
        required: false

    - id: plugin.template.with-config
      name: 配置文件工具示例
      category: example
      description: 使用配置文件的工具示例，演示如何使用配置文件
      tags: [example, template, config]
      command: scripts/with-config.sh
      args:
        - --action
        - "{{ .action }}"
        - --config
        - config/example.conf
      workdir: .
      timeout: 30s
      parameters:
        - name: action
          type: string
          description: 要执行的操作
          required: true
          default: check
      # 推荐写法：config_dir 作为插件内基准目录，config_files 只写相对文件名或相对目录项。
      # 旧写法 config_files: [config/example.conf] 仍兼容，但新插件建议使用当前短文件名写法。
      # 不要在插件包内声明宿主绝对路径；宿主路径由管理员通过 host_config_files.allowed_dirs 和 host-side mapping 显式启用。
      config_dir: config
      config_files:
        - example.conf
      confirm:
        required: false
