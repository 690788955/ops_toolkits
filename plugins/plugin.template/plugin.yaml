id: plugin.template
name: 插件开发模板
version: 1.0.0
description: 插件开发模板，包含配置文件使用示例和最佳实践
author: ops-team

contributes:
  categories:
    - id: example
      name: 示例分类
      description: 插件开发示例和模板

  tools:
    - id: plugin.template.simple
      name: 简单工具示例
      category: example
      description: 不使用配置文件的简单工具示例
      tags: [example, template]
      command: scripts/simple.sh
      args:
        - --message
        - "{{ .message }}"
      workdir: .
      timeout: 30s
      parameters:
        - name: message
          type: string
          description: 要显示的消息
          required: true
          default: Hello World
      confirm:
        required: false

    - id: plugin.template.with-config
      name: 配置文件工具示例
      category: example
      description: 使用配置文件的工具示例，演示如何使用配置文件
      tags: [example, template, config]
      command: scripts/with-config.sh
      args:
        - --action
        - "{{ .action }}"
        - --config
        - config/example.conf
      workdir: .
      timeout: 30s
      parameters:
        - name: action
          type: string
          description: 要执行的操作
          required: true
          default: check
      # 推荐写法：config_dir 作为配置基准目录；相对路径按插件目录解析，也支持当前平台可识别的绝对路径。
      # 旧写法 config_files: [config/example.conf] 仍兼容，但新插件建议使用当前短文件名写法。
      # config_files/path 必须是相对项且不能逃逸最终 config_dir；需要更细粒度管控时由管理员通过 host-side mapping 显式启用。
      config_dir: config
      config_files:
        - example.conf
      confirm:
        required: false

    - id: plugin.template.sleep-30s
      name: Sleep 30 秒示例
      category: example
      description: 等待 30 秒后完成，用于验证工作流顺序和运行态展示
      tags: [example, template, sleep]
      command: scripts/sleep-30s.sh
      workdir: .
      timeout: 45s
      parameters: []
      confirm:
        required: false
