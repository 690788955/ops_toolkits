id: plugin.template
name: 插件开发模板
version: 1.0.0
description: 插件开发模板，包含配置文件使用示例和最佳实践
author: ops-team

contributes:
  categories:
    - id: example
      name: 示例分类
      description: 插件开发示例和模板

  tools:
    - id: plugin.template.simple
      name: 简单工具示例
      category: example
      description: 不使用配置文件的简单工具示例
      tags: [example, template]
      command: scripts/simple.sh
      args:
        - --message
        - "{{ .message }}"
      workdir: .
      timeout: 30s
      parameters:
        - name: message
          type: string
          description: 要显示的消息
          required: true
          default: Hello World
      confirm:
        required: false

    - id: plugin.template.with-config
      name: 配置文件工具示例
      category: example
      description: 使用配置文件的工具示例，演示如何使用配置文件
      tags: [example, template, config]
      command: scripts/with-config.sh
      workdir: .
      timeout: 30s
      parameters:
        - name: action
          type: string
          description: 要执行的操作
          required: true
          default: check
      config_files:
        - name: example.conf
          format: ini
          description: 示例配置文件
          required: false
          pass_via: arg
          arg: --config
          default_content: |
            [service]
            name = ExampleService
            endpoint = https://api.example.com
            timeout = 30s

            [auth]
            username = admin
            password = changeme

            [options]
            debug = false
            retry = 3
      confirm:
        required: false
