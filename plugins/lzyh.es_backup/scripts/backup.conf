#!/bin/bash
# ============================================================
# ES Snapshot 备份配置文件
# 使用说明: 修改以下配置项适配你的环境
# ============================================================
#
# ===================== 跨环境迁移指南 =====================
#
# 场景: 两套 ES 环境网络不通, 需要通过备份文件离线迁移数据
#
# 【迁移步骤】
#
#   ① 源环境执行备份:
#      bash es_backup.sh
#      备份产出目录例如: /home/bangcle/tmp/backups/2026-03-25/
#
#   ② 将整个日期目录打包传输到目标机器:
#      # 源机器打包
#      tar -czf es_backup_2026-03-25.tar.gz -C /home/bangcle/tmp/backups 2026-03-25
#      # 通过 U盘/scp/其他方式 传输到目标机器
#
#   ③ 目标机器解压到 NAS_BASE_PATH 下:
#      mkdir -p /data/es_restore/backups
#      tar -xzf es_backup_2026-03-25.tar.gz -C /data/es_restore/backups
#      # 确保解压后目录结构为: /data/es_restore/backups/2026-03-25/
#
#   ④ 目标机器 elasticsearch.yml 配置:
#      path.repo: ["/data/es_restore/backups"]
#      # 重启 ES 生效 (或滚动重启)
#
#   ⑤ 确保目录权限正确:
#      chown -R elasticsearch:elasticsearch /data/es_restore/backups
#      # (用户名取决于目标 ES 的运行用户)
#
#   ⑥ 修改目标机器的 backup.conf:
#      - ES_HOST / ES_PORT / ES_USER / ES_PASSWORD → 改为目标集群的
#      - NAS_BASE_PATH → 改为目标机器上解压的路径, 如 "/data/es_restore/backups"
#      - 其他配置保持不变
#
#   ⑦ 使用恢复脚本:
#      bash es_restore.sh list                       # 查看可恢复的备份
#      bash es_restore.sh info 2026-03-25            # 查看详情
#      bash es_restore.sh restore 2026-03-25         # 恢复到目标集群
#
#      # 如果目标集群已有同名索引, 可以重命名恢复:
#      bash es_restore.sh restore 2026-03-25 \
#          --rename-pattern '(.+)' --rename-to 'migrated_$1'
#
# 【注意事项】
#
#   - 路径不需要和源环境一样! 目标机器的 NAS_BASE_PATH 可以是任意路径,
#     只要 elasticsearch.yml 的 path.repo 包含该路径即可
#   - ES 版本兼容: 目标 ES 版本 >= 源 ES 版本 (ES 不支持高版本快照恢复到低版本)
#     例如: 7.10 的快照可以恢复到 7.10 / 7.17 / 8.x, 但不能恢复到 7.9
#   - 目录必须完整拷贝, 不要漏掉任何文件 (尤其是 indices/ 目录下的数据文件)
#   - 如果目标 ES 是多节点集群, path.repo 路径需要在所有数据节点上可访问
#
# ============================================================

# -------------------- Elasticsearch 连接配置 --------------------
# ES 集群地址 (支持 http/https)
# 迁移时: 改为目标集群的地址
ES_HOST="http://172.16.61.9"
ES_PORT="9200"

# ES 认证信息 (如无认证可留空)
# 迁移时: 改为目标集群的认证信息
ES_USER="elastic"

# 建议不要在配置文件中明文写密码。
# 优先级: ES_PASSWORD(环境变量) > ES_PASSWORD_FILE(首行内容) > 本字段
# 示例: crontab 中使用 ES_PASSWORD='xxx' /path/to/es_backup.sh ...
ES_PASSWORD="${ES_PASSWORD:-}"
# 密码文件路径 (可选, 例如 /etc/es_backup.pass, 权限建议 600)
ES_PASSWORD_FILE="${ES_PASSWORD_FILE:-}"

# 是否跳过 SSL 证书验证 (自签名证书设为 true)
ES_SKIP_SSL_VERIFY="false"

# -------------------- NAS / 仓库配置 --------------------
# NAS 挂载到 ES 节点上的基础路径
# 脚本会自动在此路径下按日期创建子目录, 例如:
#   /home/bangcle/tmp/backups/2026-03-25/
#   /home/bangcle/tmp/backups/2026-03-26/
#
# 必须满足:
#   1. 所有 ES 数据节点可访问此路径
#   2. elasticsearch.yml 中配置: path.repo: ["/home/bangcle/tmp/backups"]
#   3. ES 运行用户对此路径有读写权限
#
# 迁移时: 改为目标机器上的解压路径
NAS_BASE_PATH="/home/bangcle/tmp/backups"

# ES Snapshot Repository 名称前缀 (最终名: {前缀}-{日期}, 如 nas_backup-2026-03-25)
REPO_PREFIX="nas_backup"

# 仓库是否开启压缩 (推荐 true, 减少磁盘占用)
REPO_COMPRESS="true"

# -------------------- 快照配置 --------------------
# 快照名称 (每个日期目录内只有一个快照, 固定名即可)
SNAPSHOT_NAME="full_snapshot"

# 要备份的索引 (逗号分隔, "*" 表示全部索引)
# 示例: "index1,index2,log-*"
BACKUP_INDICES="bangcle_*,bb_*"

# 是否包含全局状态 (集群设置、索引模板、ILM策略等)
# 迁移时建议 true, 这样目标集群会同时恢复模板等配置
INCLUDE_GLOBAL_STATE="true"

# 是否忽略不可用的索引 (建议 true, 避免已关闭索引导致失败)
IGNORE_UNAVAILABLE="true"

# 快照超时时间 (等待快照完成的最大时间)
SNAPSHOT_TIMEOUT="3600s"

# 恢复超时时间 (等待恢复完成的最大时间)
RESTORE_TIMEOUT="3600s"

# -------------------- 保留策略 --------------------
# 保留最近 N 个备份目录 (超出的旧目录将被清理, 0 表示不清理)
RETAIN_SNAPSHOTS=7

# -------------------- 日志配置 --------------------
# 日志文件路径
LOG_DIR="/var/log/es_backup"
# 日志保留天数
LOG_RETAIN_DAYS=30

# -------------------- 通知配置 (可选) --------------------
# 备份完成后是否发送通知
ENABLE_NOTIFY="false"
# 通知方式: email / webhook
NOTIFY_TYPE="webhook"
# Webhook URL (企业微信/钉钉/飞书等)
WEBHOOK_URL=""
# 邮件收件人 (多个用逗号分隔)
MAIL_TO=""
